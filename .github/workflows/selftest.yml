# Runs tools/selftest.py on every push and pull request. Fonts render a little
# differently on Linux than on Windows, so frames are only compared once
# tests/reference/linux/ exists; run this workflow by hand with "update" to
# get those frames as an artifact, check them and commit them.
# The runner is pinned to ubuntu-26.04, where the Linux reference frames were
# made (2026-10-29): another image may draw fonts slightly
# differently, and the frame comparison would fail without any change here.
# Moving to another image means new reference frames in the same step.
name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: "write reference frames for Linux (artifact reference-linux)"
        type: boolean
        default: false

jobs:
  selftest:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Allow Chrome's sandbox (Ubuntu restricts user namespaces since 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Pillow
        run: pip install pillow
      - name: Self-test
        run: python tools/selftest.py --out selftest-out ${{ inputs.update && '--update' || '' }}
      - name: Work folder (frames, differences)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-out
          path: selftest-out
      - name: Reference frames for Linux
        if: inputs.update
        uses: actions/upload-artifact@v7
        with:
          name: reference-linux
          path: tests/reference/linux
