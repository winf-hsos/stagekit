# A pushed tag vX.Y.Z becomes a GitHub release with the notes of that
# version from CHANGELOG.md (written by tools/release.py).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notes from CHANGELOG.md
        run: python tools/release.py --notes "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "stagekit ${GITHUB_REF_NAME#v}" --notes-file notes.md
